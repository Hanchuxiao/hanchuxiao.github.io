# 1. 网站描述 (SEO用，简短介绍)
description = "Hanchuxiao's Personal Website - USTC / Physics"
keywords = ["USTC", "Physics", "Mechanics", "Hugo", "Blog"]

[author]
  name = "Hanchuxiao"
  email = "shuyu2023@mail.ustc.edu.cn"  # 选填，不填就留空 ""
  link = "https://github.com/Hanchuxiao"
  
  # 2. 你的头像 (对应 static/images/avatar.png)
  avatar = "/images/avatar.jpg"

[app]
  # PWA 应用标题 (手机添加到主屏幕时显示的名字)
  title = "Hanchuxiao's Lab"

[header]
  [header.title]
    # 3. 网站左上角的 Logo
    # ⚠️ 之前裂图就是因为这个路径不对。
    # 这里我们直接复用你的头像作为 Logo：
    logo = "/images/avatar.jpg"
    
    # 也可以显示文字标题：
    name = "Hanchuxiao's Lab"

[home]
  [home.profile]
    enable = true
    subtitle = "The most incomprehensible thing about the world is that it is comprehensible."
    typeit = true # 开启打字机特效

[customPartials]
  head = [
    "inject/fixit-docs-bookmark.html",
  ]